services:
  load-stand-backend:
    build:
      context: ..
      dockerfile: load-stand/Dockerfile
    image: file-farm-load-stand:latest
    container_name: file-farm-load-stand
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ../protos:/proto:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet
