services:
  load-stand-backend:
    build:
      context: ..
      dockerfile: load-stand/Dockerfile
    container_name: file-farm-load-stand
    ports:
      - "8081:8081"
    environment:
      - HTTP_PORT=8081
      - TARGET_GRPC=file-farm-envoy:8080
      - PROTO_DIR=/proto
    volumes:
      - ../protos:/proto:ro
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet
