services:
  lb-controller:
    build: .
    image: file-farm-lb-controller:latest
    container_name: file-farm-lb-controller
    env_file:
      - .env
    volumes:
      - ../envoy/dynamic:/etc/envoy/dynamic
      - ./data:/app/data
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet
