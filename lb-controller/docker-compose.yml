services:
  lb-controller:
    build: .
    container_name: file-farm-lb-controller
    environment:
      - EDS_PATH=/etc/envoy/dynamic/endpoints.yaml
      - UPDATE_INTERVAL_SEC=1
      - LB_ALGORITHM=round_robin
      - CLUSTER_NAME=grpc_backend
    volumes:
      - ../envoy/dynamic:/etc/envoy/dynamic
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet
