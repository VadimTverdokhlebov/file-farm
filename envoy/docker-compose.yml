version: "3.8"

services:
  envoy:
    image: envoyproxy/envoy:v1.33-latest
    container_name: file-farm-envoy
    env_file:
      - .env
      - ../.env
    environment:
      ENVOY_PORT: ${ENVOY_PORT}
      ENVOY_BACKEND_HOST: ${ENVOY_BACKEND_HOST}
      ENVOY_BACKEND_PORT: ${ENVOY_BACKEND_PORT}
    ports:
      - "${ENVOY_PORT}:${ENVOY_PORT}"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet