global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'file-farm-monitor'

scrape_configs:
  - job_name: 'envoy'
    metrics_path: '/stats/prometheus'
    static_configs:
      - targets: ['file-farm-envoy:9901']
        labels:
          service: 'envoy-proxy'
          instance: 'file-farm-envoy'

  - job_name: 'server'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'file-farm-server-1:9092'
          - 'file-farm-server-2:9092'
          - 'file-farm-server-3:9092'
        labels:
          service: 'grpc-server'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['file-farm-cadvisor:8080']
        labels:
          service: 'cadvisor'
          instance: 'file-farm-cadvisor'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          instance: 'file-farm-prometheus'
