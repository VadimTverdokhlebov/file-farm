version: "3.8"

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${CLIENT_API_URL:-http://localhost:8080}
    container_name: file-farm-client
    env_file:
      - .env
      - ../.env
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet

