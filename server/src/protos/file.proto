syntax = "proto3";

package filefarm.file;

service FileService {
    rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
}

message UploadFileRequest {
    string filename = 1;
    bytes content = 2;
    string mimetype = 3;
}

message UploadFileResponse {
    string message = 1;
    int64 file_size = 2;
    bool success = 3;
}

