version: "3.8"

x-server-common: &server-common
  build:
    context: ..
    dockerfile: server/Dockerfile
  env_file:
    - .env
  environment:
    POSTGRES_HOST: file-farm-postgres
    GRPC_PORT: "50051"
    METRICS_PORT: "9092"
    GRPC_PROTO_FILE: protos/service.proto
    FILES_SAVE_DIR: uploads/
  volumes:
    - ../uploads:/src/uploads
    - ../protos:/src/protos
  networks:
    - appnet
  cpus: "1.0"
  mem_limit: 1g
  restart: unless-stopped

services:
  app-1:
    <<: *server-common
    container_name: file-farm-server-1
    environment:
      POSTGRES_HOST: file-farm-postgres
      GRPC_PORT: "50051"
      METRICS_PORT: "9092"
      GRPC_PROTO_FILE: protos/service.proto
      FILES_SAVE_DIR: uploads/
      INSTANCE_ID: "1"
    volumes:
      - ./logs/server-1:/src/logs
      - ../uploads:/src/uploads
      - ../protos:/src/protos

  app-2:
    <<: *server-common
    container_name: file-farm-server-2
    environment:
      POSTGRES_HOST: file-farm-postgres
      GRPC_PORT: "50051"
      METRICS_PORT: "9092"
      GRPC_PROTO_FILE: protos/service.proto
      FILES_SAVE_DIR: uploads/
      INSTANCE_ID: "2"
    volumes:
      - ./logs/server-2:/src/logs
      - ../uploads:/src/uploads
      - ../protos:/src/protos

  app-3:
    <<: *server-common
    container_name: file-farm-server-3
    environment:
      POSTGRES_HOST: file-farm-postgres
      GRPC_PORT: "50051"
      METRICS_PORT: "9092"
      GRPC_PROTO_FILE: protos/service.proto
      FILES_SAVE_DIR: uploads/
      INSTANCE_ID: "3"
    volumes:
      - ./logs/server-3:/src/logs
      - ../uploads:/src/uploads
      - ../protos:/src/protos

networks:
  appnet:
    external: true
    name: appnet
