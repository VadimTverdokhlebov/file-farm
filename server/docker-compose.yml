version: "3.8"

services:
  app:
    build:
      context: ..  # Build from project root to access protos/
      dockerfile: server/Dockerfile
    container_name: file-farm-server
    env_file:
      - ../.env  # Use common .env from project root (relative to server/)
    environment:
      GRPC_PORT: ${GRPC_PORT:-50051}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://app:secret@postgres:5432/appdb}
      MONGODB_URI: ${MONGODB_URI:-}
      GRPC_PROTO_FILE: ${GRPC_PROTO_FILE:-protos/service.proto}
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    networks:
      - appnet
    volumes:
      - ./logs:/src/logs
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet