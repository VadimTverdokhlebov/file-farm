version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: file-farm-server
    env_file:
      - .env
    environment:
      GRPC_PORT: ${GRPC_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      GRPC_PROTO_FILE: ${GRPC_PROTO_FILE}
      FILES_DIR: ${FILES_DIR}
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
    networks:
      - appnet
    volumes:
      - ./logs:/src/logs
      - ../uploads:/src/uploads
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet