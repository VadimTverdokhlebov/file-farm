version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: file-farm-server
    environment:
      GRPC_PORT: ${GRPC_PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      GRPC_PROTO_FILE: ${GRPC_PROTO_FILE}
      FILES_SAVE_DIR: ${FILES_SAVE_DIR}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
    networks:
      - appnet
    volumes:
      - ./logs:/src/logs
      - ../uploads:/src/uploads
      - ../protos:/src/protos
    restart: unless-stopped

networks:
  appnet:
    external: true
    name: appnet
